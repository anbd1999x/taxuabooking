# Triển khai PRODUCTION cho Tà Xùa Booking (VPS + domain + HTTPS).
# Dùng ĐỘC LẬP (không chồng lên docker-compose.yml):
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Kiến trúc công khai:
#   caddy (80/443, tự cấp SSL Let's Encrypt) → web (nginx: LB + cache ảnh) → app ×2 (Next.js) → db (Postgres)
# Chỉ caddy phơi cổng ra Internet; db/app/web chạy nội bộ trong mạng Docker.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taxua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxua_secret}
      POSTGRES_DB: ${POSTGRES_DB:-taxua_trip}
    # Mở 5432 để truy vấn từ xa khi test. CẢNH BÁO: truy cập được GIỚI HẠN bằng
    # iptables (DOCKER-USER) chỉ cho IP cho phép — không có rule đó thì DB phơi
    # ra Internet. Cân nhắc gỡ dòng ports này khi không còn cần test từ xa.
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taxua} -d ${POSTGRES_DB:-taxua_trip}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_SITE_URL phải có lúc build (nướng vào bundle).
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    # 2 bản chạy song song — nginx tự chia tải (Docker DNS round-robin).
    deploy:
      replicas: 2
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-taxua}:${POSTGRES_PASSWORD:-taxua_secret}@db:5432/${POSTGRES_DB:-taxua_trip}?schema=public&connection_limit=10&pool_timeout=20
      AUTH_SECRET: ${AUTH_SECRET:-doi-chuoi-bi-mat-nay-that-dai-va-ngau-nhien}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-taxua@2026}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # Khoá bảo vệ endpoint cron /api/cron/sheet-sync (crontab trên host gọi kèm ?key=).
      CRON_SECRET: ${CRON_SECRET:-}
      # Mã xác minh Google Search Console (meta tag) — giá trị công khai, hiện trong HTML.
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-LVH4byx13WP50Glg7dAX1E3YkrBhytrzyoqxqsMKuhg}
      # Đăng nhập mạng xã hội (OAuth) — lấy từ .env, để trống nếu chưa cấu hình.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_LOGIN_OFF: ${FACEBOOK_LOGIN_OFF:-}
    volumes:
      - uploads:/app/public/uploads

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    # KHÔNG phơi cổng ra host — Caddy đứng trước xử lý TLS.
    expose:
      - "80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
      # Dùng chung volume ảnh upload với app để phục vụ tĩnh /uploads/.
      - uploads:/var/www/uploads:ro

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Danh sách domain phục vụ, cách nhau bằng dấu cách (xem .env → SITE_DOMAINS).
      SITE_DOMAINS: ${SITE_DOMAINS:-localhost}
      SERVER_IP: ${SERVER_IP:-127.0.0.1}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  nginx_cache:
  caddy_data:
  caddy_config:

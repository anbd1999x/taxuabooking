# Reverse proxy / load balancer cho Tà Xùa Booking (docker compose).
# - Cân bằng tải giữa các replica của service "app" (DNS round-robin của Docker).
# - Nén gzip, buffer hợp lý, chuyển IP thật cho rate-limit phía app.
worker_processes auto;

events {
  worker_connections 2048;
}

http {
  # DNS nội bộ của Docker — re-resolve để round-robin khi app có nhiều replica.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Upload: ảnh (gốc ≤25MB, gồm HEIC iPhone) + video ≤50MB, thêm dư cho multipart.
  client_max_body_size 100m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # Cache nhẹ cho ảnh upload (ảnh đã up không đổi nội dung theo tên file).
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=uploads:10m max_size=512m inactive=7d;

  server {
    listen 80;

    # Ảnh/video đã upload: cache tại nginx 7 ngày.
    location /uploads/ {
      set $backend http://app:3000;
      proxy_pass $backend;
      proxy_cache uploads;
      proxy_cache_valid 200 7d;
      proxy_ignore_headers Cache-Control;
      add_header X-Cache-Status $upstream_cache_status;
      proxy_set_header Host $host;
    }

    location / {
      set $backend http://app:3000;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }
}

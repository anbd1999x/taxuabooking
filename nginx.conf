# Reverse proxy / load balancer cho Tà Xùa Booking (docker compose).
# - Cân bằng tải giữa các replica của service "app" (DNS round-robin của Docker).
# - Nén gzip, buffer hợp lý, chuyển IP thật cho rate-limit phía app.
worker_processes auto;

events {
  worker_connections 2048;
}

http {
  # Bảng kiểu MIME (để ảnh/video trả đúng Content-Type khi phục vụ tĩnh).
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # DNS nội bộ của Docker — re-resolve để round-robin khi app có nhiều replica.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Giữ đúng scheme gốc do Caddy chuyển xuống (Caddy↔nginx là http nội bộ nên
  # $scheme=http sẽ làm hỏng redirect_uri OAuth). Ưu tiên X-Forwarded-Proto nếu có.
  map $http_x_forwarded_proto $fwd_proto {
    default $scheme;
    "~.+"   $http_x_forwarded_proto;
  }

  # Upload: ảnh (gốc ≤25MB, gồm HEIC iPhone) + video ≤200MB, thêm dư cho multipart.
  client_max_body_size 220m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # Cache nhẹ cho ảnh upload (ảnh đã up không đổi nội dung theo tên file).
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=uploads:10m max_size=512m inactive=7d;

  server {
    listen 80;

    # Ảnh/video đã upload: nginx phục vụ TRỰC TIẾP từ volume (app Next không phục
    # vụ file public thêm lúc chạy). Volume `uploads` được mount vào đây read-only.
    location /uploads/ {
      alias /var/www/uploads/;
      # Tên file là duy nhất (mốc thời gian + chuỗi ngẫu nhiên), nội dung không bao giờ đổi ⇒ cache 1 năm.
      # (Trước đây khai cả `expires` lẫn add_header nên phát 2 dòng Cache-Control.)
      add_header Cache-Control "public, max-age=31536000, immutable";
      access_log off;
    }

    # Ảnh thu nhỏ (route /thumb của app: resize + WebP). Lưu đệm ở nginx để lần sau không vào tới Node.
    location = /thumb {
      set $backend http://app:3000;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_cache uploads;
      proxy_cache_key $uri$is_args$args;
      proxy_cache_valid 200 30d;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      add_header X-Cache $upstream_cache_status;
      access_log off;
    }

    location / {
      set $backend http://app:3000;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $fwd_proto;
      proxy_read_timeout 60s;
    }
  }
}
